<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArmelDesign ★ | Thank You for contacting !</title>
    <link rel="icon" type="image/png" href="../favicon/favicon.png" />
    <style>
      :root {
        --primary-color: #afa9d9; /*  body color */
        --secondary-color: #8082a6; /*  Aside color */
        --nav-and-footer-color: #282e40; /*  Navbar and footer color */
        --text-and-hover-color: #f2a172; /*  acrive page and hover color */

        --body-bg-color: #afa9d9;
        --text-color-initial: #ffff;
        --alt-hover-color: #f2bb9c;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #282e40, #8082a6);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .thankyou-card {
        margin: 25px 25px;
        background: var(--nav-and-footer-color);
        border-radius: 12px;
        box-shadow: 0 8px 20px var(--text-and-hover-color);
        padding: 40px;
        text-align: center;
        max-width: 400px;
        animation: fadeIn 1s ease-in-out;
      }
      .thankyou-card .checkmark {
        font-size: 60px;
        color: #adff2f;
        margin-bottom: 20px;
      }
      .thankyou-card h1 {
        font-size: 28px;
        margin: 0;
        color: var(--text-color-initial);
      }
      .thankyou-card p {
        font-size: 16px;
        color: var(--text-and-hover-color);
        margin-top: 10px;
      }
      .thankyou-card a {
        font-size: 16px;
        color: var(--text-color-initial);
        margin-top: 20px;
        text-decoration: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-image > img {
        margin-top: 10px;
        margin-bottom: 10px;
        height: 80px;
        animation: fadeIn 2s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="thankyou-card">
      <!-- <div class="checkmark">✔</div> -->
      <div class="card-image">
        <img
          src="../assets/icons/sent-message-icon.svg"
          alt="sent-messge-icon"
        />
      </div>

      <h1>Thank You!</h1>
      <p>
        Your message was submitted successfully! <br />We will reply to you
        soon!
      </p>
      <a href="https://armeldesign-solutions.web.app/"> ← Go Back</a>
    </div>
  </body>
</html>
